name: naaseh1 wheel

# This fork carries one fix on top of v0.5.2 (the RobStride parameter read
# returns when its reply is stored) until upstream releases it. It builds only
# the wheel naaseh1 installs: CPython 3.12, manylinux aarch64, on a native ARM
# runner. The build steps mirror v0.5.2's pypi-publish.yml. Upstream's publish
# workflows are removed on this branch so a tag or release here never publishes.

on:
  push:
    tags:
      - "v*naaseh1*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: python -m pip install --upgrade pip cibuildwheel==2.21.3

      - name: Build wheel
        env:
          CIBW_BUILD: "cp312-manylinux_aarch64"
          CIBW_ARCHS_LINUX: aarch64
          CIBW_BUILD_FRONTEND: pip
          CIBW_ENVIRONMENT_LINUX: MOTORBRIDGE_LIB=/project/target/release/libmotor_abi.so MOTORBRIDGE_WS_GATEWAY_BIN=/project/target/release/ws_gateway MOTOR_DM_DEVICE_BUNDLE=0
          CIBW_BEFORE_ALL_LINUX: >
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.95.0 &&
            . $HOME/.cargo/env &&
            cd /project &&
            cargo test -p motor_vendor_robstride &&
            cargo build -p motor_abi --release &&
            cargo build -p ws_gateway --release
        run: python -m cibuildwheel --platform linux bindings/python --output-dir dist

      - name: SHA-256
        run: sha256sum dist/*.whl

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-cp312-linux-aarch64
          path: dist/*.whl
          if-no-files-found: error
